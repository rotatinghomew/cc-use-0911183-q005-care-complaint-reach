[project]
name = "care-complaint-reach"
version = "0.1.0"
description = "多渠道诉求漏报估计与回访证据的联动分析的业务数据服务"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]

[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["complaints"]

[tool.unittest]
start-directory = "tests"
